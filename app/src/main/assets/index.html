<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>चाय की दुकान • Music</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{color:#fff;font-family:Arial,system-ui,sans-serif;background:#160e08;position:relative}body:before{content:"";position:fixed;inset:0;background:#160e08 url('chaiki-bg-desktop.png') center center/cover no-repeat;z-index:-2}body:after{content:"";position:fixed;inset:0;background:rgba(10,5,2,.10);z-index:-1;pointer-events:none}
.top{height:62px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;font-weight:700;text-shadow:0 2px 8px #000}.online{display:flex;align-items:center;gap:8px}.green{width:9px;height:9px;border-radius:50%;background:#20ed76;box-shadow:0 0 12px #20ed76}.links{display:flex;gap:20px}.links a{color:#fff;text-decoration:none}
.player{position:fixed;right:22px;top:76px;width:min(365px,calc(100vw - 44px));padding:17px 18px 16px;background:rgba(30,17,8,.78);border:1px solid rgba(236,176,91,.42);border-radius:17px;backdrop-filter:blur(9px);box-shadow:0 14px 45px #0008}.kicker{font-size:11px;color:#f3c47d;font-weight:800;margin-bottom:8px}.title{font-size:19px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{font-size:11px;color:#d5bda0;margin:6px 0 12px}.progress{height:5px;background:#6b4b2d;border-radius:10px;cursor:pointer}.fill{height:100%;width:0;background:#e9a444;border-radius:10px}.times{display:flex;justify-content:space-between;font-size:10px;color:#d8bea0;margin-top:5px}.controls{display:flex;justify-content:center;align-items:center;gap:15px;margin:12px 0 10px}.btn{border:0;background:#ffffff12;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer}.play{width:50px;height:50px;background:#e99a32;color:#1b1006;font-size:20px}.volume{display:flex;gap:8px;align-items:center}.volume input{flex:1;accent-color:#e9a444}.queue{margin-top:12px;border-top:1px solid #ffffff1c;padding-top:12px}.qhead{display:flex;justify-content:space-between;margin-bottom:8px}.refresh{font-size:11px;color:#e7b86f;cursor:pointer}.songs{max-height:175px;overflow:auto;display:flex;flex-direction:column;gap:5px}.song{display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:11px;background:#ffffff09;cursor:pointer;min-width:0}.song:hover,.song.active{background:#d993391f}.num{width:20px;color:#c6a47e;font-size:11px;text-align:center}.name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.badge{font-size:8px;color:#f2bd6a}.empty{text-align:center;color:#cdb89c;font-size:11px;padding:18px 5px;line-height:1.6}@media(max-width:600px){
  body:before{background-image:url('chaiki-bg-mobile.png');background-size:cover;background-position:center center}
  .top{height:44px;padding:0 10px;position:relative;z-index:6}
  .top #clock{font-size:11px}
  .online{font-size:10px;gap:5px}
  .green{width:7px;height:7px}
  .links{gap:7px;font-size:9px}
  .player{
    top:auto;left:50%;right:auto;bottom:8px;transform:translateX(-50%);
    width:210px;max-width:calc(100vw - 16px);
    padding:9px 10px 9px;border-radius:12px;
    background:rgba(30,17,8,.74);
  }
  .kicker{font-size:8px;margin-bottom:4px}
  .title{font-size:12px}
  .track{font-size:8px;margin:3px 0 6px}
  .progress{height:3px}
  .times{font-size:8px;margin-top:3px}
  .controls{gap:7px;margin:6px 0 5px}
  .btn{width:25px;height:25px;font-size:11px}
  .play{width:32px;height:32px;font-size:13px}
  .volume{font-size:10px;gap:5px}
  .queue{margin-top:6px;padding-top:6px}
  .qhead{font-size:9px;margin-bottom:4px}
  .refresh{font-size:8px}
  .songs{max-height:68px;gap:3px}
  .song{padding:5px 5px;gap:5px;border-radius:7px}
  .num{width:15px;font-size:8px}
  .name{font-size:9px}
  .badge{font-size:6px}
  .empty{font-size:8px;padding:8px 3px}
  .footer-credit{bottom:3px;font-size:8px;letter-spacing:.2px}
}

.footer-credit{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:rgba(255,235,205,.82);font-size:11px;font-weight:600;letter-spacing:.4px;text-shadow:0 2px 8px #000;z-index:5;pointer-events:none}
@media(max-height:600px) and (max-width:900px){
  .player{top:auto;bottom:6px;left:50%;right:auto;transform:translateX(-50%)}
}
</style></head><body>
<header class="top"><div id="clock">--:--</div><div class="online"><i class="green"></i><span id="count">0 songs</span></div><div class="links"><a href="https://open.spotify.com/" target="_blank">◉ Spotify ↗</a><a href="https://music.youtube.com/" target="_blank">◉ YT Music ↗</a></div></header>
<div class="footer-credit">Made By Bhim Mondal</div>
<section class="player"><div class="kicker">चाय की दुकान • आज का संगीत</div><div class="title" id="title">कोई गाना नहीं</div><div class="track" id="track">public/music में song डालें</div><div class="progress" id="progress"><div class="fill" id="fill"></div></div><div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div><div class="controls"><button class="btn" id="prev">↶</button><button class="btn play" id="play">▶</button><button class="btn" id="next">↷</button></div><div class="volume">🔊 <input id="vol" type="range" min="0" max="1" step=".01" value=".8"></div><div class="queue"><div class="qhead"><strong>🎵 आज की Playlist</strong><span class="refresh" id="refresh">⟳ Refresh</span></div><div class="songs" id="songs"></div></div><audio id="audio"></audio></section>
<script>
const A=document.getElementById("audio"),S=document.getElementById("songs"),$=id=>document.getElementById(id);let songs=[],idx=-1,sig="";
const fmt=s=>Number.isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
function render(){if(!songs.length){S.innerHTML='<div class="empty">अभी कोई song नहीं है.<br><b>public/music/</b> में audio डालें.</div>';return}S.innerHTML=songs.map((x,i)=>`<div class="song ${i===idx?"active":""}" data-i="${i}"><span class="num">${i===idx?"▶":String(i+1).padStart(2,"0")}</span><span class="name">${x.name.replace(/[&<>"]/g,"")}</span>${i===idx?'<span class="badge">PLAYING</span>':""}</div>`).join("");S.querySelectorAll(".song").forEach(e=>e.onclick=()=>load(+e.dataset.i,true))}
function load(i,auto){if(!songs[i])return;idx=i;A.src=(songs[i].url||'').startsWith('/') ? songs[i].url.slice(1) : songs[i].url;$("title").textContent=songs[i].name;$("track").textContent=`Track ${i+1} of ${songs.length}`;render();A.load();if(auto)A.play().catch(()=>{})}
async function refresh(){try{let d=await fetch("songs.json?x="+Date.now(),{cache:"no-store"}).then(r=>r.json()),n=d.map(x=>x.file).join("|"),old=idx>=0?songs[idx]?.file:null;if(n!==sig){songs=d;sig=n;if(old)idx=songs.findIndex(x=>x.file===old);else if(songs.length)idx=0;render();$("count").textContent=songs.length+" songs";if(idx>=0&&!A.src)load(idx,false)}}catch(e){console.warn(e)}}
$("play").onclick=()=>{if(!songs.length)return;if(idx<0)load(0,false);A.paused?A.play():A.pause()};$("prev").onclick=()=>songs.length&&load((idx-1+songs.length)%songs.length,true);$("next").onclick=()=>songs.length&&load((idx+1)%songs.length,true);$("refresh").onclick=refresh;$("vol").oninput=e=>A.volume=e.target.value;A.volume=.8;
A.onplay=()=>$("play").textContent="Ⅱ";A.onpause=()=>$("play").textContent="▶";A.ontimeupdate=()=>{$("fill").style.width=(A.duration?A.currentTime/A.duration*100:0)+"%";$("cur").textContent=fmt(A.currentTime)};A.onloadedmetadata=()=>$("dur").textContent=fmt(A.duration);A.onended=()=>songs.length&&load((idx+1)%songs.length,true);$("progress").onclick=e=>A.duration&&(A.currentTime=e.offsetX/e.currentTarget.clientWidth*A.duration);
function clock(){$("clock").textContent=new Date().toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"})}clock();setInterval(clock,1000);refresh();setInterval(refresh,3000);
</script></body></html>
